kind = "web"
previewPath = "/"
title = "AI"
version = "1.0.0"
id = "artifacts/neural-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18937

[services.development]
run = "pnpm --filter @workspace/neural-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neural-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/neural-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18937"
BASE_PATH = "/"
